<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="448" viewBox="0 0 1280 448" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Claude Code 安装后必做的 9 项设置</title>
  <desc id="svgDesc">居中小窗优先的技术博客 SVG 封面，完整标题配合抽象几何与环境光。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07090F"/><stop offset="0.52" stop-color="#0B0E18"/><stop offset="1" stop-color="#10142A"/>
    </linearGradient>
    <linearGradient id="accent"><stop stop-color="#FF9A82"/><stop offset="0.5" stop-color="#F06464"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
    <radialGradient id="primaryGlow"><stop stop-color="#F06464" stop-opacity="0.38"/><stop offset="0.48" stop-color="#F06464" stop-opacity="0.12"/><stop offset="1" stop-color="#F06464" stop-opacity="0"/></radialGradient>
    <radialGradient id="secondaryGlow"><stop stop-color="#9B7BFF" stop-opacity="0.24"/><stop offset="0.55" stop-color="#9B7BFF" stop-opacity="0.07"/><stop offset="1" stop-color="#9B7BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9DFF2" fill-opacity="0.13"/></pattern>
    <filter id="blur56" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="56"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.48"/></filter>
    <clipPath id="clip"><rect width="1280" height="448"/></clipPath>
  </defs>

  <rect width="1280" height="448" fill="url(#bg)"/>
  <ellipse cx="640" cy="206" rx="405" ry="210" fill="url(#primaryGlow)" filter="url(#blur56)"/>
  <ellipse cx="640" cy="410" rx="360" ry="120" fill="url(#secondaryGlow)" filter="url(#blur56)"/>

  <!-- Rich vector frame remains meaningful when the 1280×448 source is center-cropped. -->
  <g clip-path="url(#clip)" fill="none" pointer-events="none">
    <ellipse cx="640" cy="224" rx="350" ry="190" stroke="url(#accent)" stroke-width="1.7" stroke-opacity="0.32"/>
    <ellipse cx="640" cy="224" rx="306" ry="160" stroke="#D7D0FF" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="3 10"/>
    <path d="M282 99C376 23 472 14 640 14C808 14 904 23 998 99" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M278 346C372 408 477 420 640 420C803 420 908 408 1002 346" stroke="#9B7BFF" stroke-opacity="0.40" stroke-width="1.3"/>
    <path d="M304 26C382 91 390 169 359 224C331 286 345 350 414 410" stroke="#FF9A82" stroke-opacity="0.24"/>
    <path d="M976 26C898 91 890 169 921 224C949 286 935 350 866 410" stroke="#9B7BFF" stroke-opacity="0.24"/>
    <circle cx="318" cy="70" r="5" fill="#FF9A82" stroke="none"/>
    <circle cx="962" cy="70" r="5" fill="#9B7BFF" stroke="none"/>
    <circle cx="355" cy="374" r="4" fill="#9B7BFF" stroke="none"/>
    <circle cx="925" cy="374" r="4" fill="#FF9A82" stroke="none"/>
  </g>
  <rect x="354" width="572" height="448" fill="url(#dots)" opacity="0.17"/>

  <!-- All critical content stays in the measured center-crop safe zone x=354..926. -->
  <g font-family="Inter, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <g filter="url(#shadow)" fill="#F7F8FC" font-weight="780">
      <text x="640" y="112" font-size="49" letter-spacing="-1.2">Claude Code</text>
      <text x="640" y="190" font-size="49" letter-spacing="-1.2">安装后必做的</text>
      <text x="640" y="268" font-size="49" letter-spacing="-1.2">9 项设置</text>
    </g>
    <text x="640" y="328" fill="#C3CADB" font-size="18" font-weight="440" letter-spacing="0.25">交互状态栏记忆与多代理协作调优</text>
    <path d="M500 365H780" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <path d="M588 365H692" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text x="640" y="407" fill="#A9B3C9" font-size="12" font-weight="650" letter-spacing="1.8">SETUP MEMORY AGENTS</text>
  </g>

  <!-- Date is fully inside the real crop; no chopped peripheral words. -->
  <text x="640" y="432" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" fill="#8D99B2" font-size="10.5" font-weight="650" letter-spacing="2">260818</text>
</svg>
